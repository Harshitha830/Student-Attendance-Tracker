<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Report – Attendance Tracker</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">🎓 <span>AttendTrack</span></div>
    <nav>
      <a href="student-dashboard.html"><i>📊</i> <span>My Dashboard</span></a>
      <a href="student-report.html"><i>📋</i> <span>My Report</span></a>
      <a href="student-leave.html"><i>📝</i> <span>Leave Request</span></a>
      <a href="index.html" onclick="localStorage.removeItem('role');localStorage.removeItem('loggedId');"><i>🚪</i> <span>Logout</span></a>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar"><h1>My Attendance Report</h1></div>

    <div class="toolbar">
      <select id="selMonth">
        <option>June 2025</option><option>May 2025</option><option>April 2025</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="renderReport()">View Report</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print</button>
    </div>

    <div class="report-card" id="reportCard" style="margin-top:16px;">
      <div class="rc-header">
        <div>
          <h3 id="rcName">—</h3>
          <div class="rc-meta" id="rcMeta">—</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:12px;color:#888;">Month</div>
          <div style="font-weight:700;color:#1e3a5f;" id="rcMonth">—</div>
        </div>
      </div>
      <div class="rc-stats">
        <div class="rc-stat"><div class="n" id="rcTotal">—</div><div class="l">Working Days</div></div>
        <div class="rc-stat"><div class="n" style="color:#2e7d32" id="rcPresent">—</div><div class="l">Present</div></div>
        <div class="rc-stat"><div class="n" style="color:#c62828" id="rcAbsent">—</div><div class="l">Absent</div></div>
        <div class="rc-stat"><div class="n" id="rcPct">—</div><div class="l">Attendance %</div></div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;">
        <thead><tr style="background:#f0f4f8;"><th style="padding:8px">Subject</th><th style="padding:8px">Present</th><th style="padding:8px">Total</th><th style="padding:8px">%</th></tr></thead>
        <tbody id="subBody"></tbody>
      </table>
      <div id="alertBox"></div>
    </div>

    <div class="chart-box" style="margin-top:20px;max-width:560px;">
      <h2>Subject-wise Attendance</h2>
      <canvas id="barChart" height="180"></canvas>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
const subjects = ["Data Structures","DBMS","OS","Networks","Software Engg"];
const subjectData = [
  [20,22,19,21,20],[16,18,15,17,16],[24,22,25,23,24],[26,25,26,24,26],
  [22,20,23,21,22],[19,18,20,19,19],[18,17,19,18,18],[26,26,26,25,26],
];
let barInst = null;

document.addEventListener("DOMContentLoaded", () => {
  if (getRole() !== "student") { window.location.href = "index.html"; return; }
  renderReport();
});

function renderReport() {
  const s = students.find(x => x.id === getLoggedId());
  if (!s) return;
  const pct = getPct(s);
  const month = document.getElementById("selMonth").value;

  document.getElementById("rcName").textContent = s.name;
  document.getElementById("rcMeta").textContent = `${s.roll} · Group: ${s.group}`;
  document.getElementById("rcMonth").textContent = month;
  document.getElementById("rcTotal").textContent = s.total;
  document.getElementById("rcPresent").textContent = s.present;
  document.getElementById("rcAbsent").textContent = s.absent;
  document.getElementById("rcPct").textContent = pct + "%";

  const sd = subjectData[s.id - 1];
  const tbody = document.getElementById("subBody");
  tbody.innerHTML = "";
  const spcts = [];
  subjects.forEach((sub, i) => {
    const sp = sd[i], st = s.total;
    const spct = Math.round((sp / st) * 100);
    spcts.push(spct);
    tbody.innerHTML += `<tr>
      <td style="padding:8px">${sub}</td><td style="padding:8px">${sp}</td><td style="padding:8px">${st}</td>
      <td style="padding:8px"><span class="badge ${spct<75?'low':'ok'}">${spct}%</span></td>
    </tr>`;
  });

  document.getElementById("alertBox").innerHTML = pct < 75
    ? `<div class="alert-box danger">⚠ Your attendance is below 75%. Exam eligibility at risk.</div>`
    : pct < 85 ? `<div class="alert-box">📌 Attendance between 75–85%. Keep improving!</div>` : "";

  if (barInst) barInst.destroy();
  barInst = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: { labels: subjects,
      datasets: [{ data: spcts, backgroundColor: spcts.map(p => p<75?"#c62828":"#1e3a5f"), borderRadius:6 }] },
    options: { plugins:{legend:{display:false}}, scales:{y:{min:0,max:100}} }
  });
}
</script>
</body>
</html>
