<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Student Attendance Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">🎓</div>
    <h2>Student Attendance Tracker</h2>
    <p>Sign in to your account</p>
    <div class="form-group">
      <label>Role</label>
      <select id="role" onchange="toggleFields()">
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>
    </div>
    <div id="teacherFields">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="teacherEmail" value="teacher@school.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="teacherPass" value="teacher123"/>
      </div>
    </div>
    <div id="studentFields" style="display:none;">
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="studentRoll" placeholder="e.g. CST001"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="studentPass" placeholder="student123"/>
      </div>
      <p style="font-size:12px;color:#aaa;margin-top:-8px;margin-bottom:8px;">
        Roll: CST001–CST008 &nbsp;|&nbsp; Password: <strong>student123</strong> (same for all)
      </p>
    </div>
    <button class="btn btn-primary" onclick="login()">Sign In</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
function toggleFields() {
  const r = document.getElementById("role").value;
  document.getElementById("teacherFields").style.display = r === "teacher" ? "block" : "none";
  document.getElementById("studentFields").style.display = r === "student"  ? "block" : "none";
}
function login() {
  const role = document.getElementById("role").value;
  if (role === "teacher") {
    localStorage.setItem("role", "teacher");
    localStorage.setItem("loggedId", "0");
    showToast("Welcome, Teacher!");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
  } else {
    const roll = document.getElementById("studentRoll").value.trim().toUpperCase();
    const pass = document.getElementById("studentPass").value.trim();
    if (pass !== "student123") { showToast("Wrong password. Use: student123"); return; }
    const s = students.find(x => x.roll === roll);
    if (!s) { showToast("Roll number not found"); return; }
    localStorage.setItem("role", "student");
    localStorage.setItem("loggedId", String(s.id));
    showToast("Welcome, " + s.name + "!");
    setTimeout(() => { window.location.href = "student-dashboard.html"; }, 700);
  }
}
</script>
</body>
</html>
