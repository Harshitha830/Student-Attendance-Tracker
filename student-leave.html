<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave Request – Attendance Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">🎓 <span>AttendTrack</span></div>
    <nav>
      <a href="student-dashboard.html"><i>📊</i> <span>My Dashboard</span></a>
      <a href="student-report.html"><i>📋</i> <span>My Report</span></a>
      <a href="student-leave.html"><i>📝</i> <span>Leave Request</span></a>
      <a href="index.html" onclick="localStorage.removeItem('role');localStorage.removeItem('loggedId');"><i>🚪</i> <span>Logout</span></a>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar"><h1>Leave / Permission Request</h1></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">

      <div class="table-box">
        <h2 style="margin-bottom:16px;">📝 Submit New Request</h2>
        <div class="form-group">
          <label>Request Type</label>
          <select id="leaveType">
            <option>Medical Leave</option>
            <option>Personal Leave</option>
            <option>College Event</option>
            <option>Sports / Cultural Event</option>
            <option>Other Permission</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="leaveDate"/>
        </div>
        <div class="form-group">
          <label>Reason / Details</label>
          <textarea id="leaveReason" rows="4" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:vertical;" placeholder="Describe your reason..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="submitLeave()">Submit Request</button>
      </div>

      <div class="table-box">
        <h2 style="margin-bottom:16px;">My Requests</h2>
        <table>
          <thead><tr><th>Type</th><th>Reason</th><th>Date</th><th>Status</th></tr></thead>
          <tbody id="myReqTable"></tbody>
        </table>
        <div id="noReq" style="text-align:center;padding:16px;color:#aaa;font-size:13px;">No requests yet</div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("leaveDate").value = new Date().toISOString().split("T")[0];
  renderMyRequests();
});

function renderMyRequests() {
  const id    = getLoggedId();
  const mine  = getLeaveRequests().filter(r => r.studentId === id);
  const tbody = document.getElementById("myReqTable");
  tbody.innerHTML = "";
  document.getElementById("noReq").style.display = mine.length ? "none" : "block";
  mine.slice().reverse().forEach(r => {
    tbody.innerHTML += `<tr>
      <td>${r.type}</td>
      <td style="font-size:13px;">${r.reason}</td>
      <td>${r.date}</td>
      <td><span class="badge ${r.status==='approved'?'ok':r.status==='rejected'?'low':'late'}">${r.status}</span></td>
    </tr>`;
  });
}

function submitLeave() {
  const id     = getLoggedId();
  const s      = students.find(x => x.id === id);
  if (!s) { showToast("Please login first"); return; }
  const reason = document.getElementById("leaveReason").value.trim();
  if (!reason) { showToast("Please enter a reason"); return; }
  addLeaveRequest({
    studentId : id,
    roll      : s.roll,
    name      : s.name,
    group     : s.group,
    type      : document.getElementById("leaveType").value,
    reason    : reason,
    date      : document.getElementById("leaveDate").value,
    status    : "pending"
  });
  document.getElementById("leaveReason").value = "";
  showToast("✓ Request submitted! Teacher will review it.");
  renderMyRequests();
}
</script>
</body>
</html>
